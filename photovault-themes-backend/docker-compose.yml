# Local setup: API + persistent SQLite database and media files.
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////srv/data/app.db
      LOCAL_MEDIA_DIR: /srv/data/media
    ports:
      - "8000:8000"
    volumes:
      - app-data:/srv/data
volumes:
  app-data:
